# ==============================================================
#   Bygninger og opskrifter
#
#   block:           blokken der placeres (spilleren får den som item i butikken)
#   animal:          (valgfri) dyr der står oven på bygningen, fx CHICKEN, COW, PIG, SHEEP
#   hologram-height: hvor højt over blokken hologrammet sidder
#   price / level:   pris i butikken og hvilket level den låses op ved
#   slots:           antal produktionspladser fra start
#   max-slots:       maks antal pladser (kan købes i bygningens menu)
#   slot-price:      pris for næste plads = slot-price * (antal købte pladser + 1)
#   max-per-player:  hvor mange af denne bygning en spiller må have
#   function:        "production" (standard) eller "roadside" (vejbod - andre spillere kan købe dine varer)
#
#   recipes.<id>:
#     output / amount: hvilken vare og hvor mange der laves
#     time:            produktionstid i sekunder
#     xp:              xp når varen hentes
#     level:           level der kræves
#     ingredients:     varer der bruges (fra silo/lade)
# ==============================================================
