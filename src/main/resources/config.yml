# ==============================================================
#   HayDay  -  farm-plugin af TardyC
#
#   Alle tider er i sekunder (med mindre andet står).
#   Farvekoder: &a, &l osv. - og hex-farver: &#55FF55
#   Varer og afgrøder ligger i items.yml, bygninger og opskrifter i buildings.yml
# ==============================================================

economy:
  # "vault"    = brug serverens økonomi (fx EssentialsX) via Vault.
  # "internal" = HayDays egne mønter (gemmes pr. spiller).
  # Findes Vault ikke, bruges "internal" automatisk.
  type: vault
  # Navn på valutaen (bruges kun når type er "internal")
  currency-name: "mønter"
  # Startbeløb for nye spillere (kun "internal")
  start-coins: 100

general:
  # Verdener hvor man må placere marker og bygninger. Tom liste = alle verdener.
  # (Bruges kun når øerne er slået fra, eller islands.farm-only-on-island er false.)
  allowed-worlds: []
  # Hvor ofte data gemmes automatisk (minutter)
  autosave-minutes: 5
  # Shift + højreklik på en mark høster alle dine marker inden for denne radius (blokke)
  mass-action-radius: 12
  # Send en besked når marker/bygninger bliver færdige
  notify-ready: true
  # Vis en oversigt over gården når man logger ind
  join-summary: true
  # Bygninger bygges som rigtige huse og indhegninger (structures.yml) i stedet for én blok.
  # Forsiden vender mod spilleren der placerer bygningen. Der skal være plads (fri luft og fast jord).
  building-structures: true
  # Marker lægges ned i jorden (som en rigtig mark) når man sætter dem på græs/jord
  fields-in-ground: true
  # 3D-modeller fra resourcepacken: lastbil, skib, vindmøllevinger, høballer, sække, mælkejunger ...
  # Kun spillere med pakken kan se dem (andre ser bare husene).
  3d-models: true

levels:
  max-level: 50
  # XP til næste level = xp-base + (level - 1) * xp-increase
  xp-base: 20
  xp-increase: 15
  # Belønning ved level up = nyt level * coins-per-level
  coins-per-level: 50

fields:
  # Antal marker man må have = base-amount + (level - 1) * per-level (højst max-amount)
  base-amount: 4
  per-level: 1
  max-amount: 40
  # Pris for en ny mark i butikken = price-base + (antal købte marker * price-increase)
  price-base: 50
  price-increase: 20

planting:
  # Hay Day-stil: plant med 1 afgrøde fra siloen og høst 2.
  # Har du ingen af afgrøden i siloen, betaler du frø-prisen i stedet.
  use-silo-crop: true

storage:
  silo:   # afgrøder
    base-capacity: 50
    upgrade-capacity: 25
    upgrade-price-base: 300
    upgrade-price-increase: 150
    max-upgrades: 20
  barn:   # produkter (laden)
    base-capacity: 50
    upgrade-capacity: 25
    upgrade-price-base: 300
    upgrade-price-increase: 150
    max-upgrades: 20

orders:
  # Antal ordrer på ordretavlen = base-slots + (level / extra-slot-every-levels) (højst max-slots)
  base-slots: 3
  extra-slot-every-levels: 4
  max-slots: 9
  # Antal forskellige varer i en ordre
  min-items: 1
  max-items: 3
  crop-amount-min: 2
  crop-amount-max: 6
  product-amount-min: 1
  product-amount-max: 3
  # Belønning = varernes salgspris * en tilfældig multiplier mellem min og max
  reward-multiplier-min: 1.4
  reward-multiplier-max: 2.0
  # XP = varernes xp-værdi * xp-multiplier
  xp-multiplier: 1.5
  # Ventetid før en ny ordre dukker op (sekunder)
  new-order-delay: 30
  discard-delay: 180

starter:
  # Hvad nye spillere får første gang de åbner /hayday
  fields: 3
  storage:
    hvede: 6

holograms:
  # Hvor langt væk hologrammer kan ses (1.0 = ca. 64 blokke)
  view-range: 0.6
  # Tekststørrelse
  scale: 1.0
  shadow: true
  # Baggrundsfarve som ARGB hex (#AARRGGBB). #00000000 = gennemsigtig, "default" = Minecrafts grå boks
  background: "#00000000"
  # Højde over jordblokken for hologrammer på marker
  field-height: 2.1
  # Hvor ofte hologrammer og afgrøder opdateres (ticks, 20 = 1 sekund)
  update-interval: 20
  progress-bar:
    length: 12
    symbol: "▌"
    done-color: "&a"
    left-color: "&8"
  # Pladsholdere: {crop} {owner} {time} {bar} {percent} + ikoner som {icon_clock} (se "icons" længere nede)
  field:
    empty:
      - "&7&oTom mark"
      - "&8{owner}"
    growing:
      - "&e&l{crop}"
      - "{bar} &f{percent}%"
      - "{icon_clock} &7{time}"
    ready:
      - "{icon_check} &a&l{crop} er klar!"
      - "&7Højreklik for at høste"
  # Pladsholdere: {building} {owner} {product} {time} {queue} {slots} {done}
  building:
    idle:
      - "&6&l{building}"
      - "&7{owner}"
      - "&8Højreklik for at åbne"
    working:
      - "&6&l{building}"
      - "&eLaver: &f{product}"
      - "{icon_clock} &7{time} &8| {icon_crate} &7{queue}/{slots}"
    done:
      - "&6&l{building}"
      - "{icon_check} &a&l{done} vare(r) klar!"
      - "&7Højreklik for at hente"
  # Havnen. Pladsholdere: {building} {owner} {filled} {total} {time} {level}
  harbor:
    docked:
      - "&9&l{building}"
      - "{icon_crate} &e{filled}/{total} kasser fyldt"
      - "{icon_clock} &7Sejler om &f{time}"
    away:
      - "&9&l{building}"
      - "&7Skibet er ude at sejle"
      - "{icon_clock} &7Tilbage om &f{time}"
    locked:
      - "&9&l{building}"
      - "&7Skibet låses op ved level {level}"
    offline:
      - "&9&l{building}"
      - "&7{owner}s havn"
  # Vejboden. Pladsholdere: {building} {owner} {active} {sold}
  roadside:
    - "&6&l{building}"
    - "&7{owner}s vejbod"
    - "{icon_crate} &e{active} til salg &8| {icon_coin} &a{sold} solgt"
  # Top-hologrammer (/hayday holo top <navn>)
  top:
    size: 10
    title:
      - "&6&l★ TOP HAYDAY FARMERE ★"
      - ""
    entry: "&e#{rank} &f{name} &8- &aLevel {level} &7({xp} XP)"
    empty: "&8#{rank} ---"

# ==============================================================
#   Øer: hver spiller får sin egen ø i HayDay-verdenen
# ==============================================================
islands:
  # Slå øerne til/fra (kræver genstart)
  enabled: true
  # Navnet på HayDay-verdenen. Den oprettes automatisk med græsøer i et turkis hav.
  # (Med Multiverse/bukkit.yml kan generatoren også bruges som "generator: HayDay")
  world: hayday
  # Størrelse på hver ø og hvor mange blokke hav der er imellem dem.
  # OBS: kan ikke ændres når verdenen først er lavet.
  size: 48
  gap: 24
  # Højden græsset ligger i
  height: 64
  # Byg et rødt stuehus, sti, træer, blomster og startmarker på nye øer
  starter-layout: true
  # Marker og bygninger må kun placeres på spillerens egen ø (admins med hayday.bypass undtaget)
  farm-only-on-island: true
  # Send nye spillere til deres ø første gang de bruger /hayday
  teleport-on-start: true
  # Hvem må besøge en ny ø: alle, venner eller ingen (spilleren kan selv ændre det)
  default-access: alle
  # Gårdens navn hvis spilleren ikke har valgt et selv
  default-name: "{owner}s gård"
  # Gæster må fylde kasser på andres skib (de får selv belønningen) - som at hjælpe en nabo i Hay Day
  visitors-can-help-ship: true
  # Sværhedsgrad i HayDay-verdenen (peaceful = ingen monstre og ingen sult)
  difficulty: peaceful
  always-day: false
  no-weather: true
  pvp: false
  monsters: false
  fire-spread: false
  # Hologram ved indgangen til hver ø. Ejeren klikker for at åbne "Min gård", gæster klikker for at like.
  # Pladsholdere: {farm} {owner} {level} {likes} {visits} {access}
  hologram:
    - "&a&l{farm}"
    - "&7Level &f{level} &8| &c❤ &f{likes} &8| &7{visits} besøg"
    - "&8Klik for at like ❤"
  # Hologrammer over gårdens faste bygninger (klik på bygningen åbner menuen)
  # Pladsholdere: {owner} {used} {capacity} {ready} {offers}
  landmarks:
    barn:
      - "&6&lLade"
      - "&7{used}/{capacity} produkter"
    silo:
      - "&e&lSilo"
      - "&7{used}/{capacity} afgrøder"
    orderboard:
      - "&b&lOrdretavle"
      - "&a{ready} &7klar til levering"
    mailbox:
      - "&f&lAvisen"
      - "&7{offers} tilbud"
  # Hologram midt på torvet (verdenens spawn). Klik for at besøge en gård.
  spawn-hologram:
    - "&a&lVelkommen til HayDay!"
    - "&7Hver farmer har sin egen ø"
    - "&eKlik her for at besøge en gård"

# ==============================================================
#   HayDay-itemet i hotbaren (åbner menuen - kan ikke smides eller flyttes)
# ==============================================================
menu-item:
  enabled: true
  # Hotbar-plads 0-8 (8 = længst til højre)
  slot: 8
  # Item hvis spilleren ikke har resourcepacken (med pakken vises HayDays egen høballe-tekstur)
  material: WHEAT
  name: "&a&lHay&e&lDay"
  lore:
    - "&7Højreklik: åbn HayDay-menuen"
    - "&7Shift + højreklik: tag hjem til din gård"
  glow: true
  # Verdener hvor spillerne har itemet. Tom liste = alle verdener.
  worlds: []

# ==============================================================
#   Events: dobbelt penge, dobbelt XP, hurtig vækst, dobbelt høst og dobbelt produktion
#   Start med /hayday admin event start <type> [minutter] [gange]
# ==============================================================
events:
  default-multiplier: 2.0
  default-minutes: 30
  # Vis aktive events i en bossbar øverst på skærmen
  bossbar: true
  # Automatiske events: et tilfældigt event starter med jævne mellemrum (kun når ingen andre kører)
  auto:
    enabled: false
    every-minutes: 180
    duration-minutes: 30
    types: [penge, xp, vaekst, hoest, produktion]

# ==============================================================
#   Skibet: fyld kasserne med varer og send skibet afsted for en bonus
# ==============================================================
ship:
  enabled: true
  # Level hvor skibet låses op
  level: 6
  # Antal forskellige varer (1-3) og kasser pr. vare (1-3)
  crate-types: 3
  crates-per-type: 3
  crop-amount-min: 4
  crop-amount-max: 8
  product-amount-min: 1
  product-amount-max: 3
  # Belønning pr. kasse = varernes salgspris * reward-multiplier (XP = xp-værdi * xp-multiplier)
  reward-multiplier: 1.6
  xp-multiplier: 1.5
  # Ekstra bonus (i procent af alle kassers belønning) når alle kasser er fyldt og skibet sendes afsted
  bonus-percent: 25
  # Hvor længe skibet ligger i havn, og hvor længe det er væk (sekunder)
  stay-time: 7200
  away-time: 1800

# ==============================================================
#   Vejbod og avis (spillere sælger til hinanden)
# ==============================================================
market:
  # Antal pladser i vejboden fra start, og hvor mange man maks kan købe sig til (højst 14)
  base-slots: 4
  max-slots: 14
  # Pris for næste plads = slot-price * (antal købte pladser + 1)
  slot-price: 300
  # Maks antal af en vare i én kasse
  max-amount: 30
  # Prisgrænser i forhold til varens normale salgspris
  min-price-multiplier: 0.5
  max-price-multiplier: 3.0
  default-price-multiplier: 1.5
  # Efter hvor mange timer en vare udløber (0 = aldrig). Udløbne varer hentes tilbage i vejboden.
  expire-hours: 48

# ==============================================================
#   Animationer (bruger Display-entities - virker uden ekstra plugins)
# ==============================================================
animations:
  enabled: true
  # Afgrøder/varer hopper op og flyver hen til spilleren
  harvest: true
  # "+2 Hvede" tekster der svæver op
  floating-text: true
  # Svævende ikon over marker der er klar til høst
  field-icons: true
  # Roterende ikon over bygninger der producerer
  building-icons: true
  level-up-firework: true
  ready-sparkles: true
  # Brug ProtocolLib til Minecrafts rigtige "saml op"-animation (kræver ProtocolLib)
  use-protocollib: true

# ==============================================================
#   Resourcepack - Hay Day-inspirerede menu-baggrunde, egne item-ikoner og ikoner i hologrammer
# ==============================================================
resource-pack:
  # auto       = brug ItemsAdder hvis det er installeret, ellers HayDays egen resourcepack
  # own        = altid HayDays egen resourcepack
  # itemsadder = kun via ItemsAdder
  # none       = ingen resourcepack (almindelige menuer)
  mode: auto
  textured-menus: true
  custom-item-textures: true
  # Send HayDays resourcepack til spillerne når de logger ind (kun "own")
  send-on-join: true
  # Påkrævet: spillere der afviser pakken bliver smidt af. Så kan hologrammerne også bruge ikonerne.
  required: false
  prompt: "&aHayDay bruger en resourcepack med farm-grafik. &7Tryk ja for den fulde oplevelse!"
  # Hoster du selv zip-filen (plugins/HayDay/HayDay-resourcepack.zip), så skriv adressen her.
  url: ""
  # Ellers hoster HayDay den selv på denne port. "address" skal være den IP/det domæne spillerne
  # forbinder til (tom = server-ip fra server.properties). Husk at åbne porten i din firewall.
  host:
    enabled: true
    address: ""
    port: 8163

# ==============================================================
#   ItemsAdder (valgfrit) - Hay Day-inspirerede menuer og ikoner
#   Første gang kopieres indholdet til plugins/ItemsAdder/contents/hayday/
#   og /iazip køres automatisk, så alle får resourcepacken.
# ==============================================================
itemsadder:
  enabled: true
  # Teksturerede menu-baggrunde (kræver at resourcepacken er indlæst)
  textured-menus: true
  # Kopiér HayDays ItemsAdder-indhold automatisk hvis det mangler
  export-content: true
  # Kør /iazip automatisk efter indholdet er kopieret første gang
  auto-zip: true
  # Finjustering af baggrundens og titlens placering (pixels)
  texture-offset: -16
  title-offset: 0
  title-color: "&#3B2410"

# Ikoner som kan bruges i hologrammer og beskeder: {icon_clock}, {icon_check} ...
# Med ItemsAdder bruges billederne fra resourcepacken, ellers "fallback"-teksten.
icons:
  clock:
    itemsadder: ":hayday_icon_clock:"
    fallback: "&7⌚"
  check:
    itemsadder: ":hayday_icon_check:"
    fallback: "&a✔"
  coin:
    itemsadder: ":hayday_icon_coin:"
    fallback: "&6⛃"
  xp:
    itemsadder: ":hayday_icon_xp:"
    fallback: "&b★"
  crate:
    itemsadder: ":hayday_icon_crate:"
    fallback: "&6▣"
  star:
    itemsadder: ":hayday_icon_star:"
    fallback: "&e★"
