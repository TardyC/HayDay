# ==============================================================
#   Alle varer i HayDay
#
#   category: CROP     = afgrøde (gemmes i siloen, kan plantes på marker)
#   category: PRODUCT  = produkt  (gemmes i laden, laves i bygninger)
#
#   icon:        Minecraft-materiale der vises i menuer
#   color:       (valgfri) farve til potions/læder, fx "#FF8800"
#   itemsadder:  (valgfri) brug et ItemsAdder-item som ikon, fx "mitpack:tomat"
#   sell-price:  hvad varen kan sælges for
#   xp:          xp-værdi pr. stk. når varen leveres i en ordre
#
#   crop.stages: blokke der vises mens afgrøden gror (Minecraft block-data).
#                Den SIDSTE blok vises når afgrøden er klar til høst.
# ==============================================================
